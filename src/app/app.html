<main class="resume">
  <header class="intro">
    <div class="avatar" aria-hidden="true">{{ initials }}</div>
    <div class="intro-text">
      <h1>{{ fullName }}</h1>
      <p class="contact">
        <span>{{ location }}</span>
        <span>{{ phone }}</span>
        <a [href]="'mailto:' + email">{{ email }}</a>
      </p>
    </div>
  </header>

  <section>
    <h2>Personal Profile</h2>
    <p class="lead">{{ profile }}</p>
  </section>

  <app-profile-card></app-profile-card>

  <section>
    <h2>Key Skills</h2>
    <ul class="skills">
      @for (skill of skills; track skill) {
        <li>{{ skill }}</li>
      }
    </ul>
  </section>

  <section class="interaction">
    <h2>Angular Interaction</h2>
    <p class="message" aria-live="polite">{{ message }}</p>
    <button type="button" (click)="showMessage()">Count my clicks</button>
  </section>
</main>
